    <script type="text/babel">
        const {useState,useEffect,useRef}=React;

        const Repeat=()=><I><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></I>;
        const Target=()=><I><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></I>;

        const S={
            get:(k)=>{
                try{
                    const v=localStorage.getItem(k);
                    return v?{value:v}:null;
                }catch(e){
                    console.error('Storage get error:',e);
                    return null;
                }
            },
            set:(k,v)=>{
                try{
                    localStorage.setItem(k,v);
                    return{k,v};
                }catch(e){
                    if(e.name==='QuotaExceededError'){
                        // Storage full - clean old activity logs
                        console.warn('Storage quota exceeded, cleaning old data...');
                        S.cleanOldData();
                        try{
                            localStorage.setItem(k,v);
                            return{k,v};
                        }catch(e2){
                            alert('Storage full! Please export your data and clear some space.');
                            return null;
                        }
                    }
                    console.error('Storage set error:',e);
                    return null;
                }
            },
            delete:(k)=>{
                try{
                    localStorage.removeItem(k);
                    return{k,deleted:true};
                }catch(e){
                    console.error('Storage delete error:',e);
                    return null;
                }
            },
            cleanOldData:()=>{
                try{
                    // Collect keys first to avoid mutation-during-iteration
                    const keys=[];
                    for(let i=0;i<localStorage.length;i++){
                        const key=localStorage.key(i);
                        if(key&&key.endsWith('-data'))keys.push(key);
                    }
                    keys.forEach(key=>{
                        try{
                            const raw=localStorage.getItem(key);
                            if(!raw)return;
                            const data=JSON.parse(raw);
                            if(data.activityLog&&data.activityLog.length>50){
                                data.activityLog=data.activityLog.slice(0,50);
                                localStorage.setItem(key,JSON.stringify(data));
                            }
                        }catch(e){}
                    });
                }catch(e){
                    console.error('Cleanup error:',e);
                }
            },
            exportData:()=>{
                try{
                    const allData={};
                    for(let i=0;i<localStorage.length;i++){
                        const key=localStorage.key(i);
                        allData[key]=localStorage.getItem(key);
                    }
                    return JSON.stringify(allData,null,2);
                }catch(e){
                    console.error('Export error:',e);
                    return null;
                }
            }
        };

        // ========================
        // SECURITY SYSTEM - START
        // ========================
        
        // Password hashing (better than plain text)
        const hashPassword=(password,salt='pivt2026')=>{
            let hash=0;
            const str=password+salt;
            for(let i=0;i<str.length;i++){
                const char=str.charCodeAt(i);
                hash=((hash<<5)-hash)+char;
                hash=hash&hash;
            }
            return Math.abs(hash).toString(36);

                if(booster.activeWindow==='afternoon')return hour>=12&&hour<18;

            const getRankBadge=(score)=>{
                if(score>=200)return 'Infinity';

            const updateRankedLeaderboard=async()=>{
                const weekKey=getCurrentWeekKey();
                const startDate=new Date(`${weekKey.replace('ranked-','')}T00:00:00`).getTime();
                const all=[];
                if(FB.isReady()){
                    try{
                        const profiles=await FB.getAllProfiles();
                        if(profiles){
                            Object.values(profiles).forEach(p=>{
                                const score=Math.max(0,Math.floor(p.weeklyTasks||0));
                                all.push({username:p.username,score,badge:getRankBadge(score),avatar:p.avatar||'',tier:p.tier||0});
                            });
                        }
                    }catch(e){}
                }
                try{
                    for(let i=0;i<localStorage.length;i++){
                        const key=localStorage.key(i);
                        if(key&&key.endsWith('-data')){
                            const raw=localStorage.getItem(key);
                            if(!raw)continue;
                            const data=JSON.parse(raw);
                            const uname=key.replace(/^user-/,'').replace(/-data$/,'');
                            const weekly=(data.tasks||[]).filter(t=>t.completed&&t.completedAt&&t.completedAt>=startDate).length;
                            const score=Math.max(0,weekly);
                            const idx=all.findIndex(a=>a.username===uname);
                            const row={username:uname,score,badge:getRankBadge(score),avatar:data.profilePic||'',tier:data.tier||0};
                            if(idx>=0)all[idx]=row; else all.push(row);
                        }
                    }
                }catch(e){}
                all.sort((a,b)=>b.score-a.score||String(a.username).localeCompare(String(b.username)));
                setRankedBoard(all.slice(0,100));
                if(user&&FB.isReady()){
                    const mine=all.find(a=>a.username===user);
                    if(mine)try{await FB.patch(`profiles/${user}`,{weeklyTasks:mine.score,weeklyRankBadge:mine.badge,weekKey});}catch(e){}
                }
            };

            const registerSecurityViolation=(reason,severity=1)=>{

                const coinJump=Math.max(0,coins-(prev.coins||0));
                const xpJump=Math.max(0,totalXp-(prev.totalXp||0));
                const tierJump=Math.max(0,tier-(prev.tier||0));
                if(elapsed<3000&&coinJump>500000)registerSecurityViolation('Unusual coin spike detected',3);
                if(elapsed<3000&&xpJump>1000000)registerSecurityViolation('Unusual XP spike detected',3);
                if(elapsed<5000&&tierJump>2)registerSecurityViolation('Unusual tier spike detected',4);

                const baseMessage=`Hi ${username}, your P.I.V.T OTP code is ${otp}. It expires in ${expiryText}.`;

                        to_email:email,to_name:username,user_email:email,user_name:username,
                        to:email,recipient:email,recipient_email:email,target_email:email,toEmail:email,
                        from_name:'P.I.V.T Security',reply_to:'parthbaghele@gmail.com',
                        otp_code:otp,app_name:'P.I.V.T',expires_in:expiryText,message:baseMessage,subject:'P.I.V.T OTP'
                    },
                    {
                        email,name:username,passcode:otp,otp:otp,code:otp,message:baseMessage,
                        time_to_expire:expiryText,subject:'P.I.V.T OTP',
                        to_email:email,to:email,recipient:email,recipient_email:email,target_email:email,toEmail:email
                    }
                ];
                const failures=[];
                for(const payload of payloads){
                    try{return await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,payload,{publicKey:EMAILJS_PUBLIC_KEY});}
                    catch(err){failures.push({status:err?.status||0,text:(err?.text||err?.message||'').toString()});}
                }
                const error=new Error('All EmailJS payload attempts failed');
                error.failures=failures;

            };

            const sendForgotOtp=async ()=>{
                setAuthErr('');
                setResetMsg('');
                let username=sanitizeInput(authForm.username,20);
                const email=sanitizeInput(authForm.email,120).toLowerCase();
                if(!username||!email)return setAuthErr('Enter username and email first');

                const accountKey=getAccountKeyByUsername(username);
                const acc=accountKey?S.get(accountKey):null;
                if(!acc?.value)return setAuthErr('Account not found');
                const a=JSON.parse(acc.value);
                const canonicalUsername=sanitizeInput(a.username||username,20)||username;
                if((a.email||'').toLowerCase()!==email)return setAuthErr('Email doesn\'t match account');

                if(forgotOtpMeta&&forgotOtpMeta.sentAt&&(getTrustedTime()-forgotOtpMeta.sentAt)<APP_CONFIG.otp.resendCooldownMs){
                    const secondsLeft=Math.ceil((APP_CONFIG.otp.resendCooldownMs-(getTrustedTime()-forgotOtpMeta.sentAt))/1000);
                    return setAuthErr(`Please wait ${secondsLeft}s before requesting another OTP`);
                }

                const otp=generateSecureOtp();
                const salt=generateOtpSalt();
                const expires=getTrustedTime()+APP_CONFIG.otp.expiryMs;
                const otpHash=hashOtp(otp,email,canonicalUsername,salt);

                const emailjsReady=(
                    typeof emailjs!=='undefined'&&
                    EMAILJS_PUBLIC_KEY!=='YOUR_EMAILJS_PUBLIC_KEY'&&
                    EMAILJS_SERVICE_ID!=='YOUR_SERVICE_ID'&&
                    EMAILJS_TEMPLATE_ID!=='YOUR_TEMPLATE_ID'
                );

                if(!emailjsReady){
                    // Demo fallback — show OTP in a large clear modal
                    setForgotOtpMeta({otpHash,salt,expires,attempts:0,username:canonicalUsername,email,sentAt:getTrustedTime()});
                    setOtpModal({code:otp,expires,email});
                    setResetMsg('✅ Your OTP code has been generated! Copy it from the box above and paste it below.');
                    return;
                }

                setOtpSending(true);
                setResetMsg('📤 Sending OTP to your email...');

                try{
                    if(typeof emailjs?.init==='function')emailjs.init({publicKey:EMAILJS_PUBLIC_KEY});
                    const sendResult=await sendEmailOtpViaEmailJS({email,username:canonicalUsername,otp});
                    setForgotOtpMeta({otpHash,salt,expires,attempts:0,username:canonicalUsername,email,sentAt:getTrustedTime()});
                    setResetMsg(`✅ OTP sent to your email! Check inbox/spam. EmailJS status: ${sendResult?.status||'ok'}`);
                }catch(err){
                    console.error('EmailJS error:',err);
                    const firstFailure=Array.isArray(err?.failures)&&err.failures.length?err.failures[0]:null;
                    const status=firstFailure?.status||err?.status||0;
                    const detail=(firstFailure?.text||err?.text||err?.message||'').toString();
                    if(status===400)setAuthErr(`Email delivery failed (400): template mismatch. In EmailJS template, set 'To Email' to {{to_email}} and remove hardcoded recipient. ${detail}`.trim());
                    else if(status===401||status===403)setAuthErr('Email delivery failed: invalid EmailJS Public Key. Double-check it.');
                    else if(status===429)setAuthErr('Too many emails sent — EmailJS free tier limit hit. Wait a few minutes.');
                    else setAuthErr(`Failed to send OTP email. ${detail}`.trim());
                    // Graceful fallback so password reset flow still works when provider is down/misconfigured
                    setForgotOtpMeta({otpHash,salt,expires,attempts:0,username:canonicalUsername,email,sentAt:getTrustedTime()});
                    setOtpModal({code:otp,expires,email});
                    setResetMsg('⚠️ Email send failed, but OTP was generated locally so you can continue now.');
                }finally{
                    setOtpSending(false);
                }
            };

            const login=()=>{

                if(a.accountStatus==='suspended')return setAuthErr('Account suspended');
                if(a.accountStatus==='deleted')return setAuthErr('Account not found');
                
                // Verify password (check both hashed and legacy plain text)
                const inputHashed=hashPassword(authForm.password);

                applySecurityModeFromAttempts(username);
                
                if(!passwordMatch){

                // If password was plain text, upgrade to hashed
                if(a.password===authForm.password){

                if(!forgotOtpMeta)return setAuthErr('Generate an OTP first');
                if((forgotOtpMeta.username||'').toLowerCase()!==username.toLowerCase()||(forgotOtpMeta.email||'').toLowerCase()!==email)return setAuthErr('OTP is tied to a different account request');
                if(getTrustedTime()>forgotOtpMeta.expires)return setAuthErr('OTP expired. Request a new OTP');
                if((forgotOtpMeta.attempts||0)>=APP_CONFIG.otp.maxAttempts)return setAuthErr('Too many OTP attempts. Request a new OTP');

                const otpUsername=forgotOtpMeta.username||username;
                const expectedHash=hashOtp(otp,email,otpUsername,forgotOtpMeta.salt);
                if(expectedHash!==forgotOtpMeta.otpHash){
                    setForgotOtpMeta(prev=>prev?{...prev,attempts:(prev.attempts||0)+1}:prev);
                    return setAuthErr('Invalid OTP code');
                }

                const passwordCheck=validatePassword(authForm.password);
                if(!passwordCheck.valid)return setAuthErr(passwordCheck.error);

                const accountKey=getAccountKeyByUsername(otpUsername);
                const acc=accountKey?S.get(accountKey):null;
                if(!acc?.value)return setAuthErr('Account not found');

                const a=JSON.parse(acc.value);
                const canonicalUsername=sanitizeInput(a.username||username,20)||username;
                if((a.email||'').toLowerCase()!==email)return setAuthErr('Email doesn\'t match account');

                a.password=hashPassword(authForm.password);
                a.passwordResetDate=new Date().toISOString();
                a.passwordResetMethod='otp';
                S.set(accountKey||`user-${username}-account`,JSON.stringify(a));

                setForgotOtpMeta(null);
                setOtpModal(null);
                setResetMsg('✅ Password reset successfully! You can now login.');
                setTimeout(()=>{
                    setAuthMode('login');
                    setResetMsg('');
                    setAuthForm({username:'',email:'',password:'',confirmPassword:'',otp:''});
                },2200);
            };

            const deleteAcc=async()=>{

                const requestedAt=deleteRequestAt||Number(localStorage.getItem(key)||0)||0;
                const waitMs=24*60*60*1000;

                    setDeleteRequestAt(now);
                    setSecurityBanner({message:'⚠️ Deletion requested. Return after 24h to permanently delete.',mode:'hardened',at:now});

                }
                const readyAt=requestedAt+waitMs;
                if(now<readyAt){
                    const hours=Math.ceil((readyAt-now)/3600000);
                    return alert(`Deletion lock active. Try again in ~${hours} hour(s).`);

                if(!confirm('Final confirmation: permanently delete this account and all progress? This cannot be undone.'))return;

                    clean.tradeOffers=(clean.tradeOffers||[]).filter(t=>t.from!==username&&t.to!==username);

                try{

            // Publish current user's public profile to Firebase

            // Poll inbox from Firebase (cross-device) + localStorage (same-device)
            const pollBattleInbox=async()=>{
                if(!user)return;
                try{
                    // ── Firebase path ──
                    if(FB.isReady()){
                        const inbox=await FB.getInbox(user);
                        if(inbox){
                            const fbReqs=inbox.friendRequests?Object.values(inbox.friendRequests):[];
                            const fbChallenges=inbox.challenges?Object.values(inbox.challenges):[];
                            const fbTrades=inbox.trades?Object.values(inbox.trades):[];
                            setFriendRequests(prev=>{
                                const merged=[...prev];
                                fbReqs.forEach(r=>{if(!merged.find(m=>m.from===r.from))merged.push(r);});
                                return merged;
                            });
                            setChallenges(prev=>{
                                const merged=[...prev];
                                fbChallenges.forEach(incoming=>{
                                    const idx=merged.findIndex(c=>c.id===incoming.id);
                                    if(idx===-1)merged.push(incoming);
                                    else{
                                        const existing=merged[idx];
                                        const incomingStamp=Number(incoming.completedAt||incoming.updatedAt||incoming.acceptedAt||incoming.createdAt||0);
                                        const existingStamp=Number(existing.completedAt||existing.updatedAt||existing.acceptedAt||existing.createdAt||0);
                                        if(incomingStamp>=existingStamp)merged[idx]={...existing,...incoming};
                                    }
                                });
                                return merged;
                            });
                            setTradeOffers(prev=>{
                                const myIds=new Set(prev.map(t=>t.id));
                                const merged=[...prev];
                                fbTrades.forEach(t=>{if(!myIds.has(t.id))merged.push(t);});
                                return merged;
                            });
                            // Sync friend acceptances
                            if(inbox.friendAccepted){
                                const newFriendUsernames=Object.keys(inbox.friendAccepted);
                                if(newFriendUsernames.length>0){
                                    setFriends(prev=>[...new Set([...prev,...newFriendUsernames])]);
                                    // Clean them from inbox
                                    newFriendUsernames.forEach(f=>FB.deleteInbox(user,'friendAccepted',f));
                                }
                            }
                        }
                    }
                    // ── localStorage fallback (same-device) ──
                    const mySocial=readSocial(user);
                    setFriendRequests(prev=>{
                        const merged=[...prev];
                        (mySocial.friendRequests||[]).forEach(r=>{if(!merged.find(m=>m.from===r.from))merged.push(r);});
                        return merged;
                    });
                    setChallenges(prev=>{
                        const merged=[...prev];
                        (mySocial.challenges||[]).filter(c=>c.opponent===user||c.challenger===user)
                            .forEach(incoming=>{
                                const idx=merged.findIndex(c=>c.id===incoming.id);
                                if(idx===-1)merged.push(incoming);
                                else merged[idx]={...merged[idx],...incoming};
                            });
                        return merged;
                    });
                    setTradeOffers(prev=>{
                        const myIds=new Set(prev.map(t=>t.id));
                        const merged=[...prev];
                        (mySocial.tradeOffers||[]).filter(t=>t.to===user)
                            .forEach(t=>{if(!myIds.has(t.id))merged.push(t);});
                        return merged;
                    });
                }catch(e){console.error('pollBattleInbox:',e);}
            };

            // Search for players — Firebase (global) + localStorage (local)
            const searchUsers=async(query)=>{

                for(let i=0;i<localStorage.length;i++){
                    const key=localStorage.key(i);
                    if(key&&key.endsWith('-account')){
                        try{
                            const acc=JSON.parse(localStorage.getItem(key));
                            const uname=acc.username;
                            if(uname&&uname!==user&&uname.toLowerCase().includes(q)&&!seen.has(uname.toLowerCase())){
                                results.push({username:uname,source:'💻',tier:0,xp:0,streak:0,avatar:acc.avatar||''});
                                seen.add(uname.toLowerCase());

            // ── FRIEND FUNCTIONS ──

            const sendFriendRequest=async(rawInput)=>{
                const trimmed=(rawInput||'').trim();
                if(!trimmed)return alert('Enter a username!');
                const canonical=resolveUsername(trimmed);
                let targetUser=canonical||null;
                if(!targetUser){
                    if(FB.isReady()){
                        const allProfiles=await FB.getAllProfiles();
                        const matched=allProfiles?Object.values(allProfiles).find(p=>(p.username||'').toLowerCase()===trimmed.toLowerCase()):null;
                        if(!matched)return alert(`❌ Player "${trimmed}" not found.

Make sure the username is spelled correctly (it's case-insensitive). They must have logged in at least once with Firebase configured.`);
                        targetUser=matched.username;
                    }else{
                        return alert(`❌ Player "${trimmed}" not found on this device.

💡 Tip: Both players need to be on the SAME browser/device for same-device friend requests. For cross-device play, set up Firebase in the code!`);
                    }
                }
                if(targetUser.toLowerCase()===user.toLowerCase())return alert('❌ Cannot add yourself!');
                if(friends.map(f=>f.toLowerCase()).includes(targetUser.toLowerCase()))return alert(`⚠️ Already friends with ${targetUser}!`);
                const reqData={from:user,timestamp:getTrustedTime(),avatar:profilePic||''};
                let sent=false;
                if(FB.isReady()){const ok=await FB.writeInbox(targetUser,'friendRequests',user,reqData);if(ok)sent=true;}
                const lsOk=writeSocial(targetUser,d=>{
                    if(!d.friendRequests)d.friendRequests=[];
                    d.friendRequests=d.friendRequests.filter(r=>r.from.toLowerCase()!==user.toLowerCase());
                    d.friendRequests.push(reqData);return d;
                });
                if(lsOk)sent=true;
                if(sent)alert(`✅ Friend request sent to ${targetUser}!\n\nThey'll see it when they open Battle Arena.`);
                else alert('⚠️ Could not reach that player. Check your connection and try again.');
            };

            const acceptFriendRequest=async(fromUser)=>{
                const newFriends=[...new Set([...friends,fromUser])];
                setFriends(newFriends);
                setFriendRequests(prev=>prev.filter(r=>r.from!==fromUser));
                if(FB.isReady()){
                    await FB.writeInbox(fromUser,'friendAccepted',user,{username:user,timestamp:getTrustedTime()});
                    await FB.deleteInbox(user,'friendRequests',fromUser);
                    await FB.setFriends(user,newFriends.reduce((a,f)=>({...a,[f]:true}),{}));
                    const theirFBFriends=await FB.getFriends(fromUser)||{};
                    theirFBFriends[user]=true;
                    await FB.setFriends(fromUser,theirFBFriends);
                }
                writeSocial(user,d=>{d.friendRequests=(d.friendRequests||[]).filter(r=>r.from!==fromUser);return d;});
                writeSocial(fromUser,d=>{if(!d.friends)d.friends=[];if(!d.friends.includes(user))d.friends.push(user);return d;});
            };

            const rejectFriendRequest=async(fromUser)=>{
                setFriendRequests(prev=>prev.filter(r=>r.from!==fromUser));
                if(FB.isReady())await FB.deleteInbox(user,'friendRequests',fromUser);
                writeSocial(user,d=>{d.friendRequests=(d.friendRequests||[]).filter(r=>r.from!==fromUser);return d;});
            };

            const removeFriend=async(friendUsername)=>{
                if(!confirm(`Remove ${friendUsername} from friends?`))return;
                const newFriends=friends.filter(f=>f!==friendUsername);
                setFriends(newFriends);
                if(FB.isReady()){await FB.del(`social/${user}/friends/${friendUsername}`);await FB.del(`social/${friendUsername}/friends/${user}`);}
                writeSocial(user,d=>{d.friends=(d.friends||[]).filter(f=>f!==friendUsername);return d;});
                writeSocial(friendUsername,d=>{d.friends=(d.friends||[]).filter(f=>f!==user);return d;});

            // ── CHALLENGE FUNCTIONS ──

            const createChallenge=async(friendUsername,taskGoal,duration)=>{
                const goalInt=parseInt(taskGoal);const durInt=parseInt(duration);
                if(!goalInt||goalInt<1||goalInt>500)return alert('Task goal must be between 1 and 500.');
                if(!durInt||durInt<1||durInt>30)return alert('Duration must be 1–30 days.');
                if(!friends.map(f=>f.toLowerCase()).includes(friendUsername.toLowerCase()))return alert('Must be friends first!');
                const now=getTrustedTime();
                const challenge={
                    id:now.toString(36)+Math.random().toString(36).slice(2,6),
                    challenger:user,opponent:friendUsername,taskGoal:goalInt,durationDays:durInt,
                    startDate:now,endDate:now+(durInt*24*60*60*1000),
                    challengerBaseline:stats.tasksCompleted,opponentBaseline:null,
                    challengerProgress:0,opponentProgress:0,status:'pending',winner:null,createdAt:now,
                    challengerEloSnapshot:Math.max(0,elo||0),opponentEloSnapshot:null,eloAwarded:null,eloReason:''
                };
                setChallenges(prev=>[...prev,challenge]);
                let sent=false;
                if(FB.isReady()){const ok=await FB.writeInbox(friendUsername,'challenges',challenge.id,challenge);if(ok)sent=true;}
                const lsOk=writeSocial(friendUsername,d=>{
                    if(!d.challenges)d.challenges=[];
                    d.challenges=d.challenges.filter(c=>c.id!==challenge.id);
                    d.challenges.push(challenge);return d;
                });
                if(lsOk)sent=true;
                if(sent)alert(`🎯 Challenge sent to ${friendUsername}!\n\nGoal: ${goalInt} tasks in ${durInt} day${durInt>1?'s':''}.\nWaiting for them to accept.`);
                else alert('⚠️ Could not reach opponent. Check your connection.');
            };

            const acceptChallenge=async(challengeId)=>{
                const now=getTrustedTime();
                setChallenges(prev=>prev.map(c=>{
                    if(c.id!==challengeId||c.status!=='pending')return c;
                    const updated={...c,status:'active',opponentBaseline:stats.tasksCompleted,startDate:now,endDate:now+(c.durationDays*24*60*60*1000),acceptedAt:now,opponentEloSnapshot:Math.max(0,elo||0)};
                    if(FB.isReady()){FB.writeInbox(c.challenger,'challenges',challengeId,updated);FB.deleteInbox(user,'challenges',challengeId);}
                    writeSocial(c.challenger,d=>{if(!d.challenges)d.challenges=[];d.challenges=d.challenges.map(dc=>dc.id===challengeId?updated:dc);return d;});
                    writeSocial(user,d=>{if(!d.challenges)d.challenges=[];d.challenges=d.challenges.map(dc=>dc.id===challengeId?updated:dc);return d;});
                    return updated;
                }));
            };

            const declineChallenge=async(challengeId)=>{
                setChallenges(prev=>prev.filter(c=>c.id!==challengeId));
                if(FB.isReady())await FB.deleteInbox(user,'challenges',challengeId);
                writeSocial(user,d=>{d.challenges=(d.challenges||[]).filter(c=>c.id!==challengeId);return d;});
            };

            const aiChallengeEloDelta=(myElo,opponentElo,resultScore,challenge,myProgress,theirProgress)=>{
                if(resultScore===0.5)return {delta:0,reason:'Draw: no ELO change'};
                const expected=1/(1+Math.pow(10,(opponentElo-myElo)/400));
                const challengeDifficulty=Math.min(14,Math.round((challenge.taskGoal||1)/18))+Math.min(10,Math.round((challenge.durationDays||1)/3));
                const closeness=Math.max(0,myProgress-theirProgress);
                const performanceBoost=Math.min(10,Math.round((closeness/Math.max(1,challenge.taskGoal||1))*14));
                const k=20+challengeDifficulty;
                const core=Math.round(k*(resultScore-expected));
                const delta=resultScore===1?Math.max(8,core+performanceBoost):Math.min(-6,core-performanceBoost);
                const reason=`AI rated this match: K=${k}, expected=${expected.toFixed(2)}, margin=${myProgress-theirProgress}`;
                return {delta,reason};
            };

            const resolveChallengeOutcome=(challenge,now)=>{
                const cp=Math.max(0,challenge.challengerProgress||0);
                const op=Math.max(0,challenge.opponentProgress||0);
                const goal=Math.max(1,challenge.taskGoal||1);
                const reachedGoal=cp>=goal||op>=goal;
                const timedOut=now>=Number(challenge.endDate||0);
                if(!reachedGoal&&!timedOut)return null;
                const winner=cp>op?challenge.challenger:op>cp?challenge.opponent:'tie';
                const challengerElo=Math.max(0,challenge.challengerEloSnapshot||0);
                const opponentElo=Math.max(0,challenge.opponentEloSnapshot||0);
                const challengerScore=winner==='tie'?0.5:winner===challenge.challenger?1:0;
                const opponentScore=winner==='tie'?0.5:winner===challenge.opponent?1:0;
                const challengerCalc=aiChallengeEloDelta(challengerElo,opponentElo,challengerScore,challenge,cp,op);
                const opponentCalc=aiChallengeEloDelta(opponentElo,challengerElo,opponentScore,challenge,op,cp);
                const eloAwarded={challenger:challengerCalc.delta,opponent:opponentCalc.delta};
                const eloReason=`${challengerCalc.reason}`;
                return {
                    ...challenge,
                    status:'completed',
                    winner,
                    completedAt:now,
                    eloAwarded,
                    eloReason
                };
            };

            const updateChallengeProgress=()=>{
                const now=getTrustedTime();
                setChallenges(prev=>prev.map(c=>{
                    if(c.status!=='active')return c;
                    let updated={...c};
                    if(c.challenger===user)updated.challengerProgress=Math.max(0,stats.tasksCompleted-(c.challengerBaseline??0));
                    if(c.opponent===user)updated.opponentProgress=Math.max(0,stats.tasksCompleted-(c.opponentBaseline??stats.tasksCompleted));

                    const outcome=resolveChallengeOutcome(updated,now);
                    const finalChallenge=outcome||updated;
                    const other=c.challenger===user?c.opponent:c.challenger;

                    if(FB.isReady())FB.writeInbox(other,'challenges',c.id,finalChallenge).catch(()=>{});
                    writeSocial(other,d=>{if(!d.challenges)d.challenges=[];d.challenges=d.challenges.map(dc=>dc.id===c.id?finalChallenge:dc);return d;});
                    return finalChallenge;
                }));
            };

            const formatChallengeTimeLeft=(endDate)=>{
                const ms=endDate-getTrustedTime();if(ms<=0)return'Ended';
                const d=Math.floor(ms/86400000),h=Math.floor((ms%86400000)/3600000),m=Math.floor((ms%3600000)/60000);
                if(d>0)return`${d}d ${h}h left`;if(h>0)return`${h}h ${m}m left`;return`${m}m left`;
            };

            // ── TRADE FUNCTIONS ──

            const getRarityLevel=(itemId)=>{const item=shopItems.find(i=>i.id===itemId);return item?item.rarity:0;};

            const createTradeOffer=async(friendUsername,myItemId,theirItemId)=>{
                if(!myItemId)return alert('Select an item you want to offer.');
                if(!theirItemId)return alert('Select an item you want to request.');
                if(Math.abs(getRarityLevel(myItemId)-getRarityLevel(theirItemId))>1)return alert('⚖️ Trade is too uneven — items must be within 1 rarity level.');
                if(!owned.includes(myItemId))return alert('❌ You no longer own that item!');
                const trade={
                    id:getTrustedTime().toString(36)+Math.random().toString(36).slice(2,5),
                    from:user,to:friendUsername,offerItem:myItemId,requestItem:theirItemId,
                    timestamp:getTrustedTime(),status:'pending'
                };
                let sent=false;
                if(FB.isReady()){const ok=await FB.writeInbox(friendUsername,'trades',trade.id,trade);if(ok)sent=true;}
                const lsOk=writeSocial(friendUsername,d=>{
                    if(!d.tradeOffers)d.tradeOffers=[];
                    d.tradeOffers=d.tradeOffers.filter(t=>t.id!==trade.id);
                    d.tradeOffers.push(trade);return d;
                });
                if(lsOk)sent=true;
                if(sent)alert(`🤝 Trade offer sent to ${friendUsername}!`);
                else alert('⚠️ Could not reach that player. Try again.');
            };

            const acceptTrade=async(trade)=>{
                if(!owned.includes(trade.requestItem))return alert('❌ You no longer own the item they want.');
                setOwned(prev=>[...prev.filter(i=>i!==trade.requestItem),trade.offerItem]);
                setTradeOffers(prev=>prev.filter(t=>t.id!==trade.id));

            const getCountdown=(dueDate)=>{
                if(!dueDate)return null;
                const due=getSafeDate(dueDate);
                if(!due)return null;
                const diffMs=due.getTime()-getTrustedTime();
                const overdue=diffMs<0;
                const absSeconds=Math.floor(Math.abs(diffMs)/1000);
                const days=Math.floor(absSeconds/86400);
                const hours=Math.floor((absSeconds%86400)/3600);
                const minutes=Math.floor((absSeconds%3600)/60);
                const seconds=absSeconds%60;
                return {overdue,days,hours,minutes,seconds,totalSeconds:absSeconds};
            };

            const formatCountdown=(countdown)=>{
                if(!countdown)return'';
                const parts=[];
                if(countdown.days>0)parts.push(`${countdown.days}d`);
                if(countdown.hours>0||countdown.days>0)parts.push(`${countdown.hours}h`);
                if(countdown.minutes>0||countdown.days>0||countdown.hours>0)parts.push(`${countdown.minutes}m`);
                parts.push(`${countdown.seconds}s`);

            const getSortedTasks=()=>{
                return [...tasks].sort((a,b)=>{
                    // First sort by completion status (incomplete first)
                    if(a.completed!==b.completed)return a.completed?1:-1;
                    
                    // Then by priority (5=critical first, 1=low last)
                    const priorityA=a.priority||3;
                    const priorityB=b.priority||3;
                    if(priorityA!==priorityB)return priorityB-priorityA;
                    
                    // Then by due date (earliest first, no due date last)
                    if(a.dueDate&&!b.dueDate)return -1;
                    if(!a.dueDate&&b.dueDate)return 1;
                    if(a.dueDate&&b.dueDate){
                        const dateA=new Date(a.dueDate).getTime();
                        const dateB=new Date(b.dueDate).getTime();
                        if(dateA!==dateB)return dateA-dateB;
                    }
                    
                    // Finally by creation time (newest first)
                    return b.createdAt-a.createdAt;
                });

            const completeTask=(id)=>{
                const t=tasks.find(x=>x.id===id);
                if(!t||t.completed)return;
                
                const now=getTrustedTime();
                
                // Anti-cheat: Check if minimum time has passed
                if(t.canCompleteAt&&now<t.canCompleteAt){
                    const minsLeft=Math.ceil((t.canCompleteAt-now)/60000);
                    return alert(`⏰ Wait ${minsLeft} more minute(s) to complete this task!`);
                }
                
                // Anti-spam: Detect rapid task completion (max 10 tasks per minute)
                const recentCompletions=tasks.filter(x=>x.completed&&x.completedAt&&now-x.completedAt<60000);
                if(recentCompletions.length>=10){
                    return alert(`⚠️ Slow down! You can complete max 10 tasks per minute.\n\nTake a break and come back in a moment.`);
                }
                
                // Anti-spam: Detect suspicious patterns (same title completed multiple times quickly)
                const sameTaskCompletions=tasks.filter(x=>
                    x.completed&&
                    x.completedAt&&
                    now-x.completedAt<300000&&
                    x.title.toLowerCase()===t.title.toLowerCase()
                );
                if(sameTaskCompletions.length>=3){

                // Anti-spam: Check task age (can't complete task within 10 seconds of creation unless it's instant)
                if(now-t.createdAt<10000&&t.duration!=='instant'){
                    return alert(`⚠️ Task created too recently!\n\nWait at least 10 seconds before completing non-instant tasks.`);
                }
                
                // Trigger completion animation
                setTaskAnimation(prev=>({...prev,[id]:'complete'}));
                setTimeout(()=>{
                    setTaskAnimation(prev=>({...prev,[id]:null}));
                },500);
                
                const xpMult=specialEvent.doubleXpWeekend?2:1;
                const coinMult=specialEvent.goldenHour?5:1;
                const rewardXp=Math.max(1,Math.floor(t.xpRew*xpMult));
                const rewardCoins=Math.max(1,Math.floor(t.coinRew*coinMult));
                const newXp=xp+rewardXp;
                const newTotalXp=totalXp+rewardXp;
                const newCoins=coins+rewardCoins;
                const req=getLvlXp();
                setTasks(tasks.map(x=>x.id===id?{...x,completed:true,completedAt:now}:x));
                setCoins(newCoins);
                showCoinAnim(rewardCoins);
                showXpAnim(rewardXp);
                
                // Log activity
                logActivity('task_completed',{task:t.title,xp:rewardXp,coins:rewardCoins,difficulty:t.difficulty,duration:t.duration,event:specialEvent.label});

                const today=new Date(getTrustedTime()).toDateString();
                const yesterday=new Date(getTrustedTime()-86400000).toDateString();
                let newStreak=1;
                if(stats.lastTaskDate===today)newStreak=stats.currentStreak;
                else if(stats.lastTaskDate===yesterday)newStreak=stats.currentStreak+1;
                const newLong=Math.max(newStreak,stats.longestStreak);
                setStats(p=>({...p,tasksCompleted:p.tasksCompleted+1,currentStreak:newStreak,longestStreak:newLong,lastTaskDate:today}));

                if(newStreak===7&&stats.currentStreak<7){setCoins(p=>p+100);setTimeout(()=>showCoinAnim(100),300)}
                else if(newStreak===14&&stats.currentStreak<14){setCoins(p=>p+250);setTimeout(()=>showCoinAnim(250),300)}
                else if(newStreak===30&&stats.currentStreak<30){setCoins(p=>p+1000);setTimeout(()=>showCoinAnim(1000),300)}
                else if(newStreak===100&&stats.currentStreak<100){setCoins(p=>p+5000);setTimeout(()=>showCoinAnim(5000),300)}

                if(newXp>=req){
                    const rem=newXp-req;
                    const currentTierData=tiers[tier];
                    if(lvl<5){
                        setLvl(lvl+1);
                        setXp(rem);
                        setTotalXp(newTotalXp);
                        setCoins(p=>p+50);
                        setShowLvlUp(true);
                        setTimeout(()=>setShowLvlUp(false),3000);
                        logActivity('level_up',{level:lvl+1,tier:currentTierData.name,coins:50});
                    }else if(tier<41){
                        const newTier=tier+1;
                        const newSeason=getCurrentSeason(newTier);
                        const oldSeason=getCurrentSeason(tier);
                        
                        setTier(newTier);
                        setLvl(1);
                        setXp(rem);
                        setTotalXp(newTotalXp);
                        setCoins(p=>p+500);
                        
                        if(newSeason>oldSeason){
                            setSeason(newSeason);
                            const bonus=seasonBonuses[oldSeason];
                            setCoins(p=>p+bonus);
                            setShowSeasonComplete({
                                oldSeason,
                                newSeason,
                                bonus,
                                totalXp:newTotalXp,
                                tasks:stats.tasksCompleted,
                                streak:stats.currentStreak
                            });
                            setTimeout(()=>setShowSeasonComplete(null),10000);
                            logActivity('season_complete',{season:oldSeason,bonus});
                        }else{
                            setShowTierUp(true);
                            setTimeout(()=>setShowTierUp(false),4000);
                            logActivity('tier_up',{tier:tiers[newTier].name,coins:500});
                        }
                    }else{
                        setXp(req);
                        setTotalXp(newTotalXp);
                    }
                }else{
                    setXp(newXp);
                    setTotalXp(newTotalXp);
                }

            const spinWheel=(wheelTierNum)=>{
                const wheelInfo=wheelTiers.find(w=>w.tier===wheelTierNum);
                if(!wheelInfo)return;
                
                // Check if user has enough coins
                if(coins<wheelInfo.cost){
                    return alert(`❌ Not Enough Coins\n\nYou need ${wheelInfo.cost} coins for ${wheelInfo.name}\nYou have: ${coins} coins`);
                }
                
                // Deduct coins
                const newCoins=coins-wheelInfo.cost;
                setCoins(newCoins);
                setWheelTier(wheelTierNum); // track which tier was spun
                setWheelSpinning(true);
                setWheelResult(null);
                setShowWheelRewardModal(false);
                
                // Capture player's current GAME state NOW (before the setTimeout fires)
                // NOTE: 'tier' here refers to player tier (outer scope), not wheel tier number
                const snappedXp=xp; const snappedTotalXp=totalXp;
                const snappedLvl=lvl; const snappedPlayerTier=tier; const snappedSeason=season;
                
                // Simulate spinning (2 seconds)
                setTimeout(()=>{
                    // Get prizes for this wheel tier
                    const tierPrizes=wheelPrizes.filter(p=>p.tier===wheelTierNum);
                    
                    // Random selection with weighted rarity
                    const rarityWeights={common:40,uncommon:30,rare:15,epic:8,legendary:4,'ultra-core':2,relic:0.8,obsidian:0.15,mystical:0.05,transcendent:0.01,infinite:0.003};
                    const totalWeight=tierPrizes.reduce((sum,p)=>sum+(rarityWeights[p.rarity]||0.001),0);
                    let random=Math.random()*totalWeight;
                    
                    let selectedPrize=tierPrizes[0];
                    for(const prize of tierPrizes){
                        const weight=rarityWeights[prize.rarity]||0.001;
                        random-=weight;
                        if(random<=0){
                            selectedPrize=prize;
                            break;
                        }
                    }
                    
                    // Apply the prize
                    applyWheelPrize(selectedPrize);
                    setWheelResult(selectedPrize);
                    setShowWheelRewardModal(true);
                    setWheelSpinning(false);
                },2000);
                
                logActivity('wheel_spin',{tier:wheelInfo.name,cost:wheelInfo.cost});
            };

            const applyWheelPrize=(prize)=>{
                if(!prize)return;
                
                switch(prize.type){
                    case'coins':
                        setCoins(p=>p+prize.amount);
                        showCoinAnim(prize.amount);
                        break;
                    case'xp':{
                        const newXpFromPrize=snappedXp+prize.amount;
                        const newTotalXpFromPrize=snappedTotalXp+prize.amount;
                        const reqXp=tiers[Math.min(snappedPlayerTier,41)].xpPerLvl*(snappedSeason||1);
                        
                        showXpAnim(prize.amount);
                        
                        if(newXpFromPrize>=reqXp){
                            const remainder=newXpFromPrize-reqXp;
                            if(snappedLvl<5){
                                setLvl(snappedLvl+1);
                                setXp(remainder);
                                setTotalXp(newTotalXpFromPrize);
                                setCoins(p=>p+50);
                                setShowLvlUp(true);
                                setTimeout(()=>setShowLvlUp(false),3000);
                                logActivity('level_up',{level:snappedLvl+1,source:'prize_wheel'});
                            }else if(snappedPlayerTier<41){
                                const newTier=snappedPlayerTier+1;
                                const newSeason=getCurrentSeason(newTier);
                                const oldSeason=getCurrentSeason(snappedPlayerTier);
                                
                                setTier(newTier);
                                setLvl(1);
                                setXp(remainder);
                                setTotalXp(newTotalXpFromPrize);
                                setCoins(p=>p+500);
                                
                                if(newSeason>oldSeason){
                                    setSeason(newSeason);
                                    const bonus=seasonBonuses[oldSeason];
                                    setCoins(p=>p+bonus);
                                    setShowSeasonComplete({
                                        oldSeason,
                                        newSeason,
                                        bonus,
                                        totalXp:newTotalXpFromPrize,
                                        tasks:stats.tasksCompleted,

                    const rem=newFocusXp-focusReq;
                    if(lvl<5){
                        setLvl(lvl+1);setXp(rem);setCoins(p=>p+50);
                        setShowLvlUp(true);setTimeout(()=>setShowLvlUp(false),3000);
                        logActivity('level_up',{level:lvl+1,source:'focus'});
                    }else if(tier<41){
                        const newTier=tier+1;
                        const newSeason=getCurrentSeason(newTier);
                        const oldSeason=getCurrentSeason(tier);
                        setTier(newTier);setLvl(1);setXp(rem);setCoins(p=>p+500);
                        if(newSeason>oldSeason){
                            setSeason(newSeason);const bonus=seasonBonuses[oldSeason];
                            setCoins(p=>p+bonus);
                            setShowSeasonComplete({oldSeason,newSeason,bonus,totalXp:newFocusTotalXp,tasks:stats.tasksCompleted,streak:stats.currentStreak});
                            setTimeout(()=>setShowSeasonComplete(null),10000);
                        }else{setShowTierUp(true);setTimeout(()=>setShowTierUp(false),4000);}
                    }else{setXp(focusReq);}
                }else{setXp(newFocusXp);}

                alert(`🎉 Focus Session Complete!

+${bonusXp} XP
+${bonusCoins} Coins

Take a ${usedBreakMinutes} minute break!`);

                logActivity('focus_completed',{duration:usedFocusMinutes,xp:bonusXp,coins:bonusCoins});
                startBreakSession(usedBreakMinutes);
            };

            const startFocusSession=(task)=>{
                if(focusTimer||focusTimerRef.current){
                    alert('⚠️ Focus session already running');
                    return;
                }

                const validFocusDuration=Math.max(1,Math.min(120,parseInt(focusDuration,10)||25));
                const validBreakDuration=Math.max(1,Math.min(30,parseInt(breakDuration,10)||5));

                if(validFocusDuration!==focusDuration)setFocusDuration(validFocusDuration);
                if(validBreakDuration!==breakDuration)setBreakDuration(validBreakDuration);

                setActiveFocusConfig({focusMinutes:validFocusDuration,breakMinutes:validBreakDuration});
                setFocusTask(task);
                setShowFocus(true);

                launchTimer('work',validFocusDuration,()=>completeFocusSession(validFocusDuration,validBreakDuration));
                logActivity('focus_started',{task:task?.title||'No task',duration:validFocusDuration});
            };

            const stopFocusSession=()=>{
                if(!focusTimer)return;

                const confirmStop=confirm('⚠️ Stop focus session?\n\nYou won\'t get rewards if you quit early.');
                if(!confirmStop)return;

                stopFocusTimer();
                setShowFocus(false);
                setFocusTask(null);
                setFocusTimeRemaining(0);

                const price=item.price;
                if(item.season&&season<item.season)return alert(`🔒 Season ${item.season} required! You're on Season ${season}.`);
                if(tier<(item.minT||0))return alert(`Need ${tiers[item.minT||0].name} tier!`);
                if(lvl<(item.minL||1))return alert(`Need Level ${item.minL||1}!`);
                if(coins<price)return alert(`Need ${price} coins!`);
                if(owned.includes(item.id)&&item.type!=='xp_boost'&&item.type!=='coin_boost'&&item.type!=='combo_boost'&&item.type!=='ability')return alert('Already owned!');

                if(item.type==='xp_boost'||item.type==='coin_boost'||item.type==='combo_boost'){
                    if(item.activeWindow&&!isBoosterWindowActive(item)){
                        return alert(`⏰ ${item.n} can only be activated during ${getBoosterWindowLabel(item.activeWindow)}.`);
                    }

                    setCoins(p=>p-price);

                    if(item.type==='combo_boost'){
                        const expiresAt=sanitizeBoosterExpiry(getTrustedTime()+item.duration);
                        setActiveBoosters(p=>[
                            ...p,
                            {id:`${item.id}-xp-${getTrustedTime()}`,source:item.id,boost:item.xpBoost,type:'xp',expires:expiresAt,activeWindow:item.activeWindow||null},
                            {id:`${item.id}-coin-${getTrustedTime()+1}`,source:item.id,boost:item.coinBoost,type:'coin',expires:expiresAt,activeWindow:item.activeWindow||null}
                        ]);
                        alert(`Activated ${item.n}! ✨

${item.xpBoost}x XP + ${item.coinBoost}x Coins for ${Math.round(item.duration/60000)} minutes.`);
                    }else{
                        const boosterType=normalizeBoosterType(item.type);
                        setActiveBoosters(p=>[...p,{...item,type:boosterType,expires:sanitizeBoosterExpiry(getTrustedTime()+item.duration)}]);
                        alert(`Activated ${item.n}! ✨`);
                    }
                    return;
                }

                setCoins(p=>p-price);

                if(item.type==='special_char'){
                    setOwned(p=>[...p,item.id]);
                    setSpecialChars(p=>[...p,item.char]);
                    alert(`Unlocked ${item.n}! 🎉`);
                }else if(item.type==='theme'){

                    alert(`Equipped ${item.title}! 👑`);

                    setCurrentBorder(item.border);

                    alert(`Bought ${item.n}! 🎉`);

                                        <div className={`p-4 rounded-xl ui-card ${appTheme==='dark'?'bg-gray-700/50':'bg-gray-100'}`}>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <p className={`text-sm ${appTheme==='dark'?'text-gray-400':'text-gray-600'}`}>Total XP</p>
                                                    <p className={`font-bold ${appTheme==='dark'?'text-purple-400':'text-purple-600'}`}>{totalXp.toLocaleString()}</p>
                                                </div>
                                                <div>
                                                    <p className={`text-sm ${appTheme==='dark'?'text-gray-400':'text-gray-600'}`}>Tasks Done</p>
                                                    <p className={`font-bold ${appTheme==='dark'?'text-green-400':'text-green-600'}`}>{stats.tasksCompleted}</p>
                                                </div>
                                                <div>
                                                    <p className={`text-sm ${appTheme==='dark'?'text-gray-400':'text-gray-600'}`}>Current Streak</p>
                                                    <p className={`font-bold ${appTheme==='dark'?'text-orange-400':'text-orange-600'}`}>{stats.currentStreak} days</p>
                                                </div>
                                                <div>
                                                    <p className={`text-sm ${appTheme==='dark'?'text-gray-400':'text-gray-600'}`}>Best Streak</p>
                                                    <p className={`font-bold ${appTheme==='dark'?'text-yellow-400':'text-yellow-600'}`}>{stats.longestStreak} days</p>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        {/* Actions */}
                                        <div className="space-y-2 pt-2">
                                            <button onClick={()=>{const report=runFullFeatureAudit();alert(`🧪 Full Feature Audit: ${report.passCount}/${report.total} checks passed`);}} className="w-full p-3 rounded-xl font-bold bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-90 text-white transition-all">Run Full Feature Audit</button>
                                                                                        <button 
                                                onClick={exportUserData} 
                                                className="w-full p-3 rounded-xl font-bold bg-gradient-to-r from-blue-500 to-cyan-500 hover:opacity-90 text-white transition-all flex items-center justify-center gap-2"
                                            >
                                                <span>📊</span> Export Data
                                            </button>
                                            <button 
                                                onClick={logout} 
                                                className="w-full p-3 rounded-xl font-bold bg-gradient-to-r from-orange-500 to-red-500 hover:opacity-90 text-white transition-all flex items-center justify-center gap-2"
                                            >
                                                <LogOut/> Logout
                                            </button>
                                            <button onClick={deleteAcc} className="w-full p-3 rounded-xl font-bold bg-gradient-to-r from-red-700 to-red-900 hover:opacity-90 text-white transition-all">{deleteRequestAt?`Complete Account Delete (${Math.max(0,Math.ceil(((deleteRequestAt+86400000)-getTrustedTime())/3600000))}h)`:'Request Account Deletion (24h lock)'}</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}


                        {showPostLoginAuditPrompt&&(
                            <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4" onClick={()=>setShowPostLoginAuditPrompt(false)}>
                                <div className={`${appTheme==='dark'?'bg-gray-900 border-gray-700 text-white':'bg-white border-gray-200 text-gray-900'} max-w-md w-full rounded-2xl border p-5 shadow-2xl`} onClick={e=>e.stopPropagation()}>
                                    <h3 className="text-xl font-black mb-2">🛡️ Quick System Check</h3>
                                    <p className="text-sm opacity-80 mb-4">Run a full gameplay health check now? This helps verify time, battle, goals, habits, shop, settings, wheel, timezone, anti-cheat, OTP, and animation systems after login.</p>
                                    <div className="flex gap-2">
                                        <button onClick={()=>setShowPostLoginAuditPrompt(false)} className="flex-1 px-3 py-2 rounded-lg bg-gray-700 text-white font-bold">Later</button>
                                        <button onClick={()=>{const a=runFullFeatureAudit();const b=runFinalCompleteDebug();const c=runUltimateGameplayAudit();alert(`✅ Deep system checks done
Full: ${a.passCount}/${a.total}
Complete: ${b.pass}/${b.total}
Ultimate: ${c.pass}/${c.total}`);setShowPostLoginAuditPrompt(false);}} className="flex-1 px-3 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-bold">Run Checks</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showSet&&<div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80 p-4"><div className="adaptive-modal adaptive-card bg-gray-800 rounded-2xl p-8 max-w-2xl w-full border border-gray-700 animate-modal-slide animate-glow-ring max-h-screen overflow-y-auto scrollbar-hide"><h2 className="text-3xl font-bold mb-6 flex items-center gap-2"><Settings/><span>Settings</span></h2><div className="space-y-4 mb-6"><div className="bg-gray-700 rounded-xl p-4"><div className="flex items-center gap-3 mb-2"><User/><span className="text-gray-400 text-sm">Username</span></div><p className="text-xl font-bold">{user}</p></div><div className="bg-gray-700 rounded-xl p-4"><div className="flex items-center gap-3 mb-2"><Trophy/><span className="text-gray-400 text-sm">Progress</span></div><p className="text-xl font-bold">{ct.name} - Level {lvl}</p><p className="text-sm text-gray-400 mt-1">{coins.toLocaleString()} Coins 💰</p></div><div className="bg-gray-700 rounded-xl p-4"><div className="flex items-center gap-3 mb-2"><Star/><span className="text-gray-400 text-sm">Stats</span></div><p className="text-lg">{stats.tasksCompleted} tasks • {stats.currentStreak} day streak</p><p className="text-sm text-gray-400">Best: {stats.longestStreak} days</p></div><div className="bg-gray-700 rounded-xl p-4"><div className="flex items-center gap-3 mb-3"><Clock/><span className="text-gray-400 text-sm">Time Zone</span></div><p className="text-xs text-gray-400 mb-2">Current: <span className="text-cyan-300 font-bold">{getTimezoneClock().pretty} ({getTimezoneClock().shortZone})</span></p><select value={timeZone} onChange={(e)=>setTimeZone(e.target.value)} className="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">{timeZoneChoices.map(tz=><option key={tz} value={tz}>{tz}</option>)}</select></div><div className="bg-gray-700 rounded-xl p-4"><div className="flex items-center gap-3 mb-2"><Clock/><span className="text-gray-400 text-sm">Activity Log (Last {activityLog.length})</span></div><div className="max-h-48 overflow-y-auto scrollbar-hide space-y-2 mt-2">{activityLog.length===0?<p className="text-gray-500 text-sm">No activity yet</p>:activityLog.slice(0,20).map((log,i)=><div key={i} className="bg-gray-800 rounded p-2 text-xs"><p className="text-gray-400">{log.date}</p><p className="text-white font-bold">{log.type==='task_completed'?`✅ ${log.details.task}`:log.type==='level_up'?`⬆️ Level ${log.details.level}`:log.type==='tier_up'?`🌟 ${log.details.tier}`:log.type}</p>{log.details.xp&&<p className="text-yellow-400">+{log.details.xp} XP, +{log.details.coins} Coins</p>}</div>)}</div></div></div><div className="space-y-3"><button onClick={exportUserData} className="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-blue-500 to-cyan-500 hover:opacity-90 transition-all flex items-center justify-center gap-2"><Star/><span>Export Data</span></button><button onClick={logout} className="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-orange-500 to-red-500 hover:opacity-90 transition-all flex items-center justify-center gap-2"><LogOut/><span>Logout</span></button><button onClick={deleteAcc} className="w-full py-3 rounded-xl font-bold bg-red-900 hover:bg-red-800 transition-all text-red-200">Delete Account</button><button onClick={()=>setShowSet(false)} className="w-full py-3 rounded-xl font-bold bg-gray-700 hover:bg-gray-600 transition-all">Close</button></div></div></div>}

                        <div className={`text-center mt-8 ${appTheme==='dark'?'text-gray-500':'text-gray-600'} text-sm`}><p>🔥 Keep grinding! Every task brings you closer to CELESTIAL tier! 💪</p></div>
                    </div>
                </div>
                </div>
            );
        };

        ReactDOM.render(<Game/>,document.getElementById('root'));
    </script>
</body>
</html>
